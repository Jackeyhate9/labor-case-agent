name: Deploy project website
on:
  push:
    branches: [main]
    paths: ["docs/site/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public website
        run: |
          mkdir -p docs/site/images
          cp docs/images/v02-evidence-locator.png docs/site/images/
          touch docs/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
