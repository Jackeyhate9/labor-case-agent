[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "labor-case-agent-api"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pillow>=10.4",
  "pymupdf>=1.24",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "cryptography>=46.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3.24", "pillow>=10.4"]
postgres = ["psycopg[binary]>=3.2"]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]

[tool.coverage.run]
# These are separately launched model-runtime entrypoints; the API process
# never imports their CLI bodies, so in-process coverage would report a false 0%.
omit = ["app/model_workers/*"]
