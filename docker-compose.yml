services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labor_case_agent
      POSTGRES_USER: labor
      POSTGRES_PASSWORD: labor_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labor -d labor_case_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

